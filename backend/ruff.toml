# Lint for correctness, not style: real bugs (undefined names, unused imports/variables, bad comparisons).
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B", "S102", "S307", "S324"]
ignore = ["B008", "B904", "B905", "B007", "E741"]  # B008: FastAPI Depends() defaults; B904/B905: style, no behaviour change

[lint.per-file-ignores]
"tests/*" = ["B011", "F811"]
