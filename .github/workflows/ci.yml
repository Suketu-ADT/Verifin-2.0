name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly: new advisories appear against unchanged code

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU torch, versions pinned by the lock file)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt -c requirements.lock.txt
      - name: Lint
        run: ruff check app tests eval
      - name: Unit and API tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
      - name: Static security analysis
        run: bandit -q -r app -ll
      - name: Known-vulnerability scan of pinned dependencies
        run: pip-audit -r requirements.lock.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Known-vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: verifin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and reports healthy
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=development -e DEBUG=false -e ALLOW_DB_FALLBACK=true \
            -e AUTH_ENABLED=false verifin-api:ci
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/api/v1/system/live && exit 0
            sleep 3
          done
          docker logs api
          exit 1
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0 (pinned to the commit)
        with:
          image-ref: verifin-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
