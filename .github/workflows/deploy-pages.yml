name: Deploy frontend to GitHub Pages

# Needs a public repository on the GitHub Free plan, Pages enabled with "GitHub Actions" as the source, and the repository
# variable API_BASE_URL set to the deployed API (for example https://verifin-api-xxxx-uc.a.run.app).
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "Set the repository variable API_BASE_URL first."; exit 1; }
          npm run build
          # Pages has no rewrite rules: serving the app shell as 404.html makes deep links such as /dashboard work.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
